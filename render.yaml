databases:
  - name: bps-db
    databaseName: bps_erp
    user: bps_admin
    region: singapore
    plan: free

services:
  - type: web
    name: bps-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: bps-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: "*"
      - key: SCHOOL_NAME
        value: "Brindawan Public School"
